# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: flow-sketch-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: https://gjwjdansnu-del.github.io,http://localhost:5173,http://localhost:5174
